[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-factory"
version = "0.1.0"
description = "Product Factory backend runtime for product preparation workflows."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
product-factory-api = "pipeline.dev.start:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
