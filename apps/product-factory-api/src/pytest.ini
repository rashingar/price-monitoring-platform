[pytest]
testpaths = product_factory/tests
markers =
    fast: local deterministic tests with no live network, browser, or external service dependency
    unit: pure or near-pure tests with no external dependencies
    contract: API, schema, artifact, or request/response contract tests
    smoke: fast endpoint or runtime smoke tests without external dependencies
    stage: isolated current pipeline stage tests
    source_acquisition: source acquisition, parsing, or normalization tests
    prepare: prepare-stage tests
    filters: category, filter, characteristics, or filter-map tests
    filter_review: product-level category filter review tests
    authoring: LLM authoring artifact validation and retry tests using local fixtures
    render: deterministic render assembly and validation tests
    publish: publish handoff tests without real OpenCart
    job_lifecycle: job runner, store, worker, status, cancellation, and kill tests
    integration: local filesystem or subprocess integration tests
    slow: tests unsuitable for quick Codex verification
    e2e: full prepare/render/publish workflow tests
    external: tests requiring live websites, browser automation against live pages, OpenCart, OpenAI, credentials, or network
    legacy: tests tied to removed or inactive runtime paths
